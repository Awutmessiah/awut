  <main class="card">

      <span class="terminal">awut@localhost:~$</span>

      <div><strong id="views">000000</strong><small>views</small></div>

    <a class="discord" href="https://discord.gg/revshit" target="_blank" rel="noopener">

        <b>Join my Discord</b>
